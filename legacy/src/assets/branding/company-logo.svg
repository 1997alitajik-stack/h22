<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background & Shading Gradients -->
    <linearGradient id="rasta-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="teal-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="40%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <linearGradient id="emerald-accent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="gold-pillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="ring-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#5eead4" flood-opacity="0.4" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- Base emblem container (rounded squircle) -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#rasta-bg)" stroke="#1e293b" stroke-width="4" filter="url(#soft-shadow)" />

  <!-- Outer dynamic orbit ring (Symbol of continuous evaluation & growth) -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="url(#ring-glow)" stroke-width="3" stroke-dasharray="14 8" opacity="0.6" />
  <circle cx="250" cy="250" r="165" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.4" />

  <!-- Central Motif: Architectural Persian Pathway & Ascending RASTA Geometric Monogram -->
  <!-- Left ascending dynamic wing (Capability & Talent) -->
  <path d="M 155 350 L 155 210 Q 155 140 220 120 L 220 185 Q 195 198 195 240 L 195 350 Z" 
        fill="url(#teal-primary)" 
        filter="url(#soft-shadow)" />

  <!-- Right ascending symmetric dynamic wing (Experience & Career Path) -->
  <path d="M 345 350 L 345 210 Q 345 140 280 120 L 280 185 Q 305 198 305 240 L 305 350 Z" 
        fill="url(#emerald-accent)" 
        filter="url(#soft-shadow)" />

  <!-- Center vertical pillar & golden trajectory diamond (True North / Straight Path - راستا) -->
  <path d="M 235 365 L 265 365 L 265 195 L 235 195 Z" 
        fill="url(#teal-primary)" opacity="0.9" />

  <!-- Golden Beacon Diamond (The guiding apex of talent assessment) -->
  <polygon points="250,90 280,135 250,180 220,135" 
           fill="url(#gold-pillar)" 
           filter="url(#soft-shadow)" />

  <!-- Internal core focal ring -->
  <circle cx="250" cy="135" r="14" fill="#ffffff" opacity="0.95" />
  <circle cx="250" cy="135" r="7" fill="#b45309" />

  <!-- Bottom Horizontal Stabilizer Bar with geometric precision nodes -->
  <rect x="135" y="345" width="230" height="14" rx="7" fill="#0f766e" />
  <circle cx="155" cy="352" r="5" fill="#5eead4" />
  <circle cx="250" cy="352" r="6" fill="#fbbf24" />
  <circle cx="345" cy="352" r="5" fill="#34d399" />

  <!-- Micro constellation nodes symbolizing connected holding entities & subsidiaries -->
  <circle cx="120" cy="220" r="4" fill="#14b8a6" opacity="0.8" />
  <circle cx="380" cy="220" r="4" fill="#10b981" opacity="0.8" />
  <circle cx="250" cy="60" r="4.5" fill="#fbbf24" opacity="0.9" />
</svg>
